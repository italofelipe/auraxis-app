name: OTA Update (EAS Update)

# Publica um update over-the-air (JS-only) no canal escolhido, sem consumir
# créditos de build do EAS. Para mudanças nativas (nova dependência nativa,
# bump de version/runtimeVersion), use o workflow Store Release.
# Regras do ciclo em docs/release-process.md.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Canal do EAS Update"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      release_notes:
        description: "Changelog detalhado pt-BR (2+ bullets, 100–500 caracteres)"
        required: true
        type: string

concurrency:
  group: ota-update-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  publish-update:
    name: Publish OTA update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate detailed OTA changelog
        env:
          STORE_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          node scripts/store-release-notes.cjs from-text \
            --version "$(jq -r '.version' package.json)" \
            --output-dir build/store-release

      - name: Validate EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "Missing required secret: EXPO_TOKEN" >&2
            exit 1
          fi

      - name: Setup Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 21.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Guard — require channel/environment
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          # Guard duro: aborta ANTES do `eas update` se o canal (usado tanto em
          # `--channel` quanto em `--environment`) vier ausente/vazio. Sem
          # `--environment` o Expo não inlina os `EXPO_PUBLIC_*` no bundle OTA,
          # deixando `EXPO_PUBLIC_API_URL` undefined (fallback localhost) e
          # quebrando todas as chamadas de API no device. Ver issues #564/#646.
          if [ -z "${CHANNEL:-}" ]; then
            echo "::error::CHANNEL/--environment ausente ou vazio — abortando OTA para não publicar bundle com EXPO_PUBLIC_* undefined." >&2
            exit 1
          fi
          echo "OK — canal/environment resolvido: ${CHANNEL}"

      - name: Publish update
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${CHANNEL:-}" ]; then
            echo "::error::CHANNEL/--environment vazio no passo de publish — abortando." >&2
            exit 1
          fi
          # `--environment` é OBRIGATÓRIO: o Expo inlina `EXPO_PUBLIC_*` em
          # build-time. Sem ele, o bundle do OTA sai com essas envs `undefined`
          # (incl. EXPO_PUBLIC_API_URL → fallback localhost), quebrando todas as
          # chamadas à API no device. O `--environment` puxa as EAS env vars do
          # ambiente correspondente ao canal. Ver issue #564.
          eas update \
            --channel "$CHANNEL" \
            --environment "$CHANNEL" \
            --message "$(jq -r '.releaseNotes' build/store-release/metadata.json)" \
            --non-interactive
