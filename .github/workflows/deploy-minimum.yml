name: Deploy Minimum (App Baseline)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_eas_build:
        description: "Executar build preview no EAS"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      release_notes:
        description: "Obrigatório se houver build: 2+ bullets pt-BR, 100–500 caracteres"
        required: false
        type: string

jobs:
  web-baseline-artifact:
    name: Export Web Baseline Artifact
    runs-on: ubuntu-latest
    # Guard-rail (#510): export travado não pode segurar runner por 6h.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # O changelog de loja é exigido de quem publica (job `eas-preview-build`),
      # não deste export. Todo push em `main` chega aqui sem `release_notes` e
      # o gate derrubava o job antes de exportar qualquer coisa (#722).
      - name: Export web bundle
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        # Mata o processo no teardown pós-export e valida o artefato (#510/#532).
        run: |
          # `|| status=$?` é obrigatório: o GitHub injeta `bash -e`, e o exit
          # 137 do KILL abortaria o script antes da validação do artefato.
          status=0
          timeout --signal=KILL 10m npx expo export --platform web --output-dir dist-web || status=$?
          if [ ! -d dist-web ] || [ -z "$(ls -A dist-web 2>/dev/null)" ]; then
            echo "::error::expo export did not produce dist-web (exit $status)"
            exit 1
          fi
          echo "Export artifact validated (exit $status tolerated as post-export teardown hang)."

      - name: Upload web baseline artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-web-baseline
          path: dist-web/
          retention-days: 14

  eas-preview-build:
    name: EAS Preview Build
    runs-on: ubuntu-latest
    concurrency:
      group: eas-preview-manual
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.run_eas_build == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Require detailed release notes for any published build
        env:
          STORE_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ -z "${STORE_RELEASE_NOTES:-}" ]; then
            echo "::error::Informe release_notes (2+ bullets pt-BR, 100–500 caracteres) para publicar um build."
            exit 1
          fi

      # Roda no mesmo job que dispara o build: `build/store-release/` é local ao
      # runner e não sobrevive entre jobs (#722).
      - name: Validate detailed preview changelog
        env:
          STORE_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          node scripts/store-release-notes.cjs from-text \
            --version "$(jq -r '.version' package.json)" \
            --output-dir build/store-release

      - name: Validate EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "Missing required secret: EXPO_TOKEN" >&2
            exit 1
          fi

      - name: Setup Expo
        uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # v9
        with:
          eas-version: 21.2.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Trigger preview build
        run: |
          eas build \
            --platform all \
            --profile preview \
            --message "$(jq -r '.releaseNotes' build/store-release/metadata.json)" \
            --non-interactive \
            --no-wait
