name: Mobile Critical E2E

# Híbrido de builds (#734): o E2E compila SEMPRE no runner do GitHub
# (prebuild + Gradle/xcodebuild, sem assinatura). A cota de builds do EAS fica
# reservada para releases de loja. A governança
# (check-runtime-release-governance) bloqueia builds via EAS neste workflow.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mobile-critical-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Espelho do ambiente EAS `preview` para o bundle JS. Os valores vivem em
  # GitHub variables — nunca hardcoded no YAML (docs/release-process.md).
  EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
  EXPO_PUBLIC_APP_ENV: ${{ vars.EXPO_PUBLIC_APP_ENV }}
  EXPO_PUBLIC_POSTHOG_API_KEY: ${{ vars.EXPO_PUBLIC_POSTHOG_API_KEY }}
  EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
  # Paridade com o profile e2e-test do eas.json: build de teste não sobe
  # source maps para o Sentry (sem credenciais no runner).
  SENTRY_DISABLE_AUTO_UPLOAD: "true"
  E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
  E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

jobs:
  android:
    name: Android build + Maestro
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Sem `cache: gradle`: os arquivos Gradle só existem após o prebuild
      # (projeto CNG), e o setup-java falha ao hashear um checkout sem eles.
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate E2E credentials
        id: validate-e2e-credentials
        run: |
          set -euo pipefail
          test -n "${E2E_EMAIL:-}" || { echo "::error::Missing E2E_EMAIL"; exit 1; }
          test -n "${E2E_PASSWORD:-}" || { echo "::error::Missing E2E_PASSWORD"; exit 1; }

      - name: Install project and mobile tooling
        run: |
          npm ci --ignore-scripts
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build Android APK on the runner
        run: |
          set -euo pipefail
          cd android
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/auraxis-e2e.apk"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/e2e-sha.txt"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android critical flow
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          target: google_apis
          script: |
            set -euo pipefail
            mkdir -p "$RUNNER_TEMP/maestro-results"
            adb install -r "$RUNNER_TEMP/auraxis-e2e.apk"
            MAESTRO_TESTS_DIR="$RUNNER_TEMP/maestro-results" maestro test \
              -e E2E_EMAIL="$E2E_EMAIL" \
              -e E2E_PASSWORD="$E2E_PASSWORD" \
              .maestro/10_mobile_stability_visual.yaml

      - name: Upload Android screenshots and build identity
        if: ${{ always() && steps.validate-e2e-credentials.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-e2e-android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/maestro-results/
            ${{ runner.temp }}/e2e-sha.txt
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS Simulator build + Maestro
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Validate E2E credentials
        id: validate-e2e-credentials
        run: |
          set -euo pipefail
          test -n "${E2E_EMAIL:-}" || { echo "::error::Missing E2E_EMAIL"; exit 1; }
          test -n "${E2E_PASSWORD:-}" || { echo "::error::Missing E2E_PASSWORD"; exit 1; }

      - name: Install project and mobile tooling
        run: |
          npm ci --ignore-scripts
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Prebuild iOS project
        run: |
          set -euo pipefail
          npx expo prebuild --platform ios --no-install
          npx pod-install ios

      - name: Build iOS Simulator app on the runner
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$workspace"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
          app_path="$(find "$RUNNER_TEMP/derived/Build/Products/Release-iphonesimulator" \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          mkdir -p "$RUNNER_TEMP/ios-app"
          cp -R "$app_path" "$RUNNER_TEMP/ios-app/"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/e2e-sha.txt"

      - name: Boot simulator and run iOS critical flow
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available \
            | awk -F '[()]' '/iPhone/ { print $2; exit }')"
          test -n "$device_id"
          xcrun simctl boot "$device_id" 2>/dev/null || true
          open -a Simulator
          xcrun simctl bootstatus "$device_id" -b
          app_path="$(find "$RUNNER_TEMP/ios-app" -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          xcrun simctl install "$device_id" "$app_path"
          mkdir -p "$RUNNER_TEMP/maestro-results"
          MAESTRO_TESTS_DIR="$RUNNER_TEMP/maestro-results" maestro test \
            -e E2E_EMAIL="$E2E_EMAIL" \
            -e E2E_PASSWORD="$E2E_PASSWORD" \
            .maestro/10_mobile_stability_visual.yaml

      - name: Upload iOS screenshots and build identity
        if: ${{ always() && steps.validate-e2e-credentials.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-e2e-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/maestro-results/
            ${{ runner.temp }}/e2e-sha.txt
          if-no-files-found: error
          retention-days: 30
